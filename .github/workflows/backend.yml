name: Backend logging
on:
  pull_request:
    paths: ['chips-backend/**', '.github/workflows/backend.yml']
  push:
    branches: [master]
    paths: ['chips-backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: chips-test-only
          POSTGRES_DB: chips_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:chips-test-only@localhost:5432/chips_test
    defaults:
      run:
        working-directory: chips-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: chips-backend/requirements*.txt
      - run: pip install -r requirements-test.txt
      - name: Verify deployment tooling
        run: |
          command -v pwsh
          sh -n chips-api.openrc
          pwsh -NoProfile -NonInteractive -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "deploy.ps1"), [ref]$null, [ref]$errors) > $null; if ($errors.Count) { throw ($errors | Out-String) }'
      - name: Validate HTTPS proxy template offline
        run: docker run --rm --network none -v "$PWD/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: python -m pytest -q
