name: Android

on:
  pull_request:
    paths: ['chips-mobile/**', '.github/workflows/android.yml']
  push:
    branches: [master]
    paths: ['chips-mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chips-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build, lint and unit tests
        run: bash ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --stacktrace
      - name: Save APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: |
            chips-mobile/app/build/outputs/apk/debug/*.apk
            chips-mobile/app/build/reports/

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Navigation and preview checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: chips-mobile
          script: bash ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Save device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-tests
          path: chips-mobile/app/build/reports/androidTests/
